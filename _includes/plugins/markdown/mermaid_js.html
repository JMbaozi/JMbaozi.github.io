{% if page.mermaid or site.mermaid %}
<script src="https://npm.elemecdn.com/mermaid/dist/mermaid.min.js"></script>
<script>
    $(document).ready(function () {
        mermaid.initialize({
            startOnLoad: true,
            theme: "default",
        });
        mermaid.init(undefined, $('.mermaid2'));
    });
</script>
{% endif %}
